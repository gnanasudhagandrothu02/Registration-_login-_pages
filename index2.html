<!DOCTYPE html>
<html>
    <head>
        <title>Employee registration form</title>
    </head>
    <body>
        <h1>Employee Registration Form</h1>
        <form>
            <label>Full Name:</label>
            <input type="text" id="FullName" name="full name" placeholder="<Enter the full name>" required>
            <br><br>
            <label>User Name: </label>
            <input type="text" id="UserName" name="user name" placeholder="<user name>"required>
            <br><br>
            <label>Email:</label>
            <input type="email" name="email" placeholder="----email-----"required>
            <br><br>
            <label>Password:</label>
            <input type="password" name="password" required>
            <br><br>
            <label>Confirm password:</label>
            <input type="password" name="confirm password" required>
            <br><br>
            <label>Phone Number:</label>
            <input type="tel" name="phone number" required>
            <br><br>
            <label>Date Of Birth:</label>
            <input type="date" name="dob" required>
            <br><br>
            <label>Gender:</label>
            <input type="radio" name="gender" value="female" required>female
            <input type="radio" name="gender" value="male" required>male
            <input type="radio" name="gender" value="others" required>others
            <br><br>
            <label>Address:</label>
            <br>
            <textarea name="address" rows="7" cols="30" required></textarea>
            <br><br>
            <label>city</label>
            <input type="text" name="city" required>
            <br><br>
            <label>State:</label>
<select name="state" required>
    <option value="">Select State</option>
    <option>Andhra Pradesh</option>
    <option>Arunachal Pradesh</option>
    <option>Assam</option>
    <option>Bihar</option>
    <option>Chhattisgarh</option>
    <option>Goa</option>
    <option>Gujarat</option>
    <option>Haryana</option>
    <option>Himachal Pradesh</option>
    <option>Jharkhand</option>
    <option>Karnataka</option>
    <option>Kerala</option>
    <option>Madhya Pradesh</option>
    <option>Maharashtra</option>
    <option>Odisha</option>
    <option>Punjab</option>
    <option>Rajasthan</option>
    <option>Tamil Nadu</option>
    <option>Telangana</option>
    <option>Uttar Pradesh</option>
    <option>Uttarakhand</option>
    <option>West Bengal</option>
</select>
<br><br>
<label>Country:</label>

<select name="country" required>
    <option value="">Select Country</option>
    <option>India</option>
    <option>United States</option>
    <option>United Kingdom</option>
    <option>Canada</option>
    <option>Australia</option>
    <option>Germany</option>
    <option>France</option>
    <option>Japan</option>
    <option>China</option>
    <option>Singapore</option>
</select>
<br><br>
<label>Upload profile picture:</label>
<input type:"file" name="profile photo" accept="image/*" >
<br><br>
<label> Hobbies:</label>
<input type="checkbox" name="hobbies" value="reading">reading
<input type="checkbox" name="hobbies" value="sloving">sloving
<input type="checkbox" name="hobbies" value="sleeping">sleeping
<input type="checkbox" name="hobbies" value="watching tv">watching tv
<br><br>
<input type="checkbox" name="terms" required>
<label>i agree with this terms and continue</label>
<br><br>
<input type="submit" value="Submit">
        </form>
        <script>
    const form = document.getElementById("registrationForm");

    form.addEventListener("submit", function(event) {
        event.preventDefault();

        const fullName = document.getElementById("fullName").value;
        const userName = document.getElementById("userName").value;

        console.log("Full Name:", fullName);
        console.log("User Name:", userName);
    });
</script>
    </body>
</html>
