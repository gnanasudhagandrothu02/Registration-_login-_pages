<!DOCTYPE html>
<html>
    <head>
        <title>Employee registration form</title>
    </head>
    <body>
        <h1>Employee Registration Form</h1>
        <form id="registrationForm" action="/reister">

            <label>Full Name:</label>
            <input type="text" id="FullName" name="full name">
            <br><br>
            <label>User Name: </label>
            <input type="text"id="Username" name="user Name" >
            <br><br>
            <label>Email:</label>
            <input type="email"  id="Email" name="email">
            <br><br>
            <label>Password:</label>
            <input type="password" id="Password" name="password">
            <br><br>
            <label>Confirm password:</label>
            <input type="password" id="ConfirmPassword" name="confirm password">
            <br><br>
            <label>Phone Number:</label>
            <input type="tel" id="PhoneNumber" name="phone number">
            <br><br>
            <label>Date Of Birth:</label>
            <input type="date" id="Dateofbirth" name="birth">
            <br><br>
            <label>Gender:</label>
            <input type="radio" id="Gender" name="gender" value="female" >female
            <input type="radio" id="Gender" name="gender" value="male">male
            <input type="radio" id="Gender" name="gender"  value="others">others
            <br><br>
            <label>Address:</label>
            <br>
            <textarea id="Address" name="address" rows="7" cols="30"></textarea>
            <br><br>
            <label>city</label>
            <input type="text" id="City" name="city">
            <br><br>
            <label>State:</label>
<select name="state" id="State">

</select>
<br><br>
<label>Upload profile picture:</label>
<input type:"file" id="Uploadprofilephoto" name="profile photo" accept="image/*" >

<input type="checkbox" name="hobbies" value="reading">reading
